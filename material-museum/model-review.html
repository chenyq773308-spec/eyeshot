<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EYESHOT · 统一模型复原对照</title><style>*{box-sizing:border-box}body{background:#eeece3;color:#233b33;font:16px system-ui;margin:0;padding:40px}header{max-width:1400px;margin:auto}h1{font-size:30px}p{color:#677770;line-height:1.7}a{color:inherit}article{max-width:1400px;margin:36px auto;border-top:1px solid #a0ada5;padding-top:16px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0}img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#d6d8d1}figcaption{margin:10px 0;color:#617269;font-size:14px}.missing{opacity:.2}@media(max-width:750px){body{padding:22px}.pair{grid-template-columns:1fr}}</style><header><a href="/">← 返回场景展示</a><h1>一栋艺术馆 · 十个机位</h1><p>左侧为已认可的空间概念图，右侧为统一模型的实际渲染。右侧处于复原检查阶段；主展示保留已认可的画面。十个机位共用建筑、材料与陈设，仅切换摄影机。</p><a href="assets/reconstruction/museum-master.glb" download>GLB 模型</a></header><main id="scenes"></main><script type="module">const report=await fetch('assets/reconstruction/report.json').then(r=>r.json());const main=document.querySelector('#scenes');for(const s of report.scenes){const a=document.createElement('article');a.id='scene-'+s.id;const n=String(s.id).padStart(2,'0');a.innerHTML=`<h2>${n} ${s.name}</h2><div class="pair"><figure><img src="assets/campaign/scene-${n}.jpg"><figcaption>已认可的空间概念图</figcaption></figure><figure><img src="assets/reconstruction/${s.render}" onerror="this.classList.add('missing');this.alt='模型画面尚未生成'"><figcaption>统一模型实际渲染 · ${s.review_note||'待逐场审查'}</figcaption></figure></div>`;main.append(a);}</script></html>
